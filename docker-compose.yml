version: '3.8'
services:
  frontend:
    image: node:18
    working_dir: /app
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    ports:
      - '5173:5173'
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  backend:
    build: ./apps/backend
    volumes:
      - ./apps/backend:/app
    ports:
      - '8000:8000'
